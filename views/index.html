<!DOCTYPE html>
<html>
<head>
    <title>Word to PDF Converter</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container">

    <h1>Word to PDF Converter v2</h1>

    <p>
        Upload a Microsoft Word document (.docx)
        and convert it into PDF.
    </p>

    <form
        action="/upload"
        method="POST"
        enctype="multipart/form-data"
        onsubmit="showLoading()"
    >

        <input
            type="file"
            name="document"
            accept=".docx"
            required
        >

        <br><br>

        <button type="submit">
            Convert to PDF
        </button>

    </form>

    <div id="loading" style="display:none;">
        <p>Converting document...</p>
    </div>

</div>

<script>
function showLoading() {
    document.getElementById("loading").style.display = "block";
}
</script>

</body>
</html>
