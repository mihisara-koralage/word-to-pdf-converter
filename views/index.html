<!DOCTYPE html>
<html>
<head>
    <title>Word to PDF Converter</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class="container">
        <h1>Word to PDF Converter</h1>

        <p>Upload a Word document and convert it to PDF.</p>

        <form>
            <input type="file" accept=".docx">
            <br><br>

            <button type="submit">
                Convert to PDF
            </button>
        </form>
    </div>

</body>
</html>
